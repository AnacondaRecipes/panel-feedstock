{% set name = "panel" %}
{% set version = "1.9.4" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 373bdb124c1b33c3dd4c112f348f4cfb2a7f1634b36a51e6ab01a4b5b6ec833c

build:
  number: 0

outputs:
  - name: panel-core
    build:
      number: 0
      skip: true  # [py<310]
      entry_points:
        - panel = panel.command:main
      script:
        - $PYTHON -m pip install . -vv  --no-deps --no-build-isolation  # [unix]
        - '"%PYTHON%" -m pip install . -vv  --no-deps --no-build-isolation'  # [win]
    requirements:
      host:
        - pip
        - python
        - hatchling
        - hatch-vcs
        - param >=2.1.0
        - bokeh >=3.8.0,<3.10.0
        - pyviz_comms >=0.7.4
        - requests
        - packaging
        - nodejs >=18
      run:
        - python
        - bokeh >=3.7.0,<3.10.0
        - param >=2.1.0,<3.0
        - pyviz_comms >=2.0.0
        - markdown
        - markdown-it-py
        - linkify-it-py
        - mdit-py-plugins
        - narwhals >=2
        - requests
        - nh3
        - typing-extensions
        - pandas >=1.2
        - packaging
        - tqdm
      run_constrained:
        - holoviews >=1.18.0
        - bokeh-fastapi >=0.1.5,<0.2.0
    test:
      imports:
        - panel
        - panel.io
      requires:
        - pip
        - pytest >=7
        - pytest-asyncio
        - pytest-rerunfailures <16.0
        - pytest-xdist
        - esbuild
        - nodejs >=18
      commands:
        - panel --help
        - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
        - pytest --pyargs panel.tests --asyncio-mode=auto --log-cli-level=INFO -k "not test_autoreload_app_local_module"
  - name: panel
    build:
      number: 1
      skip: true  # [py<310]
    requirements:
      host:
        - pip
        - python
      run:
        - python
        - {{ pin_subpackage('panel-core', exact=True) }}
        - panel-material-ui >=0.10.0
    test:
      imports:
        - panel
      requires:
        - pip
        - python
      commands:
        - pip check

about:
  home: https://panel.holoviz.org
  summary: The powerful data exploration & web app framework for Python
  description: |
    Panel provides tools for easily composing widgets, plots, tables, and other
    viewable objects and controls into control panels, apps, and dashboards.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  doc_url: https://panel.holoviz.org
  dev_url: https://github.com/holoviz/panel

extra:
  recipe-maintainers:
    - philippjfr
  skip-lints:
    - host_section_needs_exact_pinnings
    # pip check is also intentionally omitted for panel-core
    # because the upstream python metadata still requires panel-marerial-ui,
    # which is installed by the full panel metapackage rather than the core package.
    - missing_pip_check
    # The output uses conda-build's inline build.script command syntax,
    # while this lint rule expects outputs[].script to be a script file path.
    - wrong_output_script_key
