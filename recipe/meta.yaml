{% set name = "panel" %}
{% set version = "1.9.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4d7de30561e31674451ade5f029cddbec6156fd30f3e4cfd7da82f6ecfcbb98f

build:
  number: 0
  skip: true  # [py<310]
  entry_points:
    - panel = panel.command:main
  script:
    - {{ PYTHON }} -m pip install . -vv  --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - hatchling
    - hatch-vcs
    - param >=2.1.0
    - bokeh >=3.8.0,<3.10.0
    - pyviz_comms >=0.7.4
    - requests
    - packaging
    - nodejs >=18
  run:
    - python
    - bokeh >=3.7.0,<3.10.0
    - param >=2.1.0,<3.0
    - pyviz_comms >=2.0.0
    - panel-material-ui >=0.10.0
    - markdown
    - markdown-it-py
    - linkify-it-py
    - mdit-py-plugins
    - narwhals >=2
    - requests
    - nh3
    - typing-extensions
    - pandas >=1.2
    - packaging
    - tqdm
  run_constrained:
    - holoviews >=1.18.0
    # set bokeh-fastapi bounds as discussed in https://github.com/AnacondaRecipes/panel-feedstock/pull/39
    - bokeh-fastapi >=0.1.5,<0.2.0

test:
  source_files:
    - pyproject.toml
  imports:
    - panel
    - panel.io
  requires:
    - pip
    - pytest >=7
    - pytest-asyncio
    - pytest-rerunfailures <16.0
    - pytest-xdist
    - esbuild
    - nodejs
  commands:
    - pip check
    - panel --help
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest --pyargs panel.tests

about:
  home: https://panel.holoviz.org
  summary: The powerful data exploration & web app framework for Python
  description: |
    Panel provides tools for easily composing widgets, plots, tables, and other
    viewable objects and controls into control panels, apps, and dashboards.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  doc_url: https://panel.holoviz.org
  dev_url: https://github.com/holoviz/panel

extra:
  recipe-maintainers:
    - philippjfr
  skip-lints:
    - host_section_needs_exact_pinnings